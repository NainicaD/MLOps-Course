<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Breast Tumor Classifier</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main class="card">
    <h1>Breast Tumor Classifier</h1>
    <p class="sub">Enter four measurements of cell nuclei from a biopsy image to predict whether the tumor is malignant or benign. This is a course demo, not a diagnostic tool.</p>

    <form id="tumor-form">
      <label>Mean radius<input name="radius_mean" type="number" step="any" value="12.2" required></label>
      <label>Mean texture<input name="texture_mean" type="number" step="any" value="17.4" required></label>
      <label>Worst concave points<input name="concave_points_worst" type="number" step="any" value="0.074" required></label>
      <label>Worst area<input name="area_worst" type="number" step="any" value="547" required></label>
      <button type="submit">Predict</button>
    </form>

    <div id="result" class="result hidden"></div>
  </main>

  <script>
    document.getElementById("tumor-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const box = document.getElementById("result");
      const res = await fetch("/predict", { method: "POST", body: new FormData(e.target) });
      const data = await res.json();
      box.classList.remove("hidden");
      if (!res.ok) { box.textContent = data.error; return; }
      const rows = Object.entries(data.probabilities)
        .map(([k, v]) => `<li>${k}: ${(v * 100).toFixed(1)}%</li>`).join("");
      box.innerHTML = `<strong>${data.prediction}</strong> (${(data.confidence * 100).toFixed(1)}% confidence)<ul>${rows}</ul>`;
    });
  </script>
</body>
</html>
